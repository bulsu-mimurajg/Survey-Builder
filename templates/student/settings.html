{% extends 'student/base_student.html' %}

{% block title %}Account Settings - sixsayvensurvey.io{% endblock %}

{% block student_content %}
<!-- Header -->
<div class="mb-8 pb-4 border-b border-gray-300">
    <h1 class="text-3xl font-bold text-gray-900 mb-2">Account Settings</h1>
    <p class="text-sm text-gray-500">Manage your account settings and preferences.</p>
</div>

<!-- Settings Form -->
<div class="bg-white border border-gray-200 rounded-lg shadow p-6">
    <form method="post" action="{% url 'student-settings' %}">
        {% csrf_token %}
        
        <!-- Profile Information -->
        <div class="mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Profile Information</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="first_name" class="block mb-2 text-sm font-medium text-gray-900">First Name</label>
                    <input type="text" name="first_name" id="first_name" value="{{ user.first_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                </div>
                <div>
                    <label for="last_name" class="block mb-2 text-sm font-medium text-gray-900">Last Name</label>
                    <input type="text" name="last_name" id="last_name" value="{{ user.last_name }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                </div>
            </div>
            
            <div class="mt-4">
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
                <input type="email" name="email" id="email" value="{{ user.email }}" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
            </div>
        </div>
        
        <!-- Change Password -->
        <div class="mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">Change Password</h2>
            
            <div class="space-y-4">
                <div>
                    <label for="current_password" class="block mb-2 text-sm font-medium text-gray-900">Current Password</label>
                    <input type="password" name="current_password" id="current_password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                </div>
                <div>
                    <label for="new_password" class="block mb-2 text-sm font-medium text-gray-900">New Password</label>
                    <input type="password" name="new_password" id="new_password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                </div>
                <div>
                    <label for="confirm_password" class="block mb-2 text-sm font-medium text-gray-900">Confirm New Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5">
                </div>
            </div>
        </div>
        
        <!-- Submit Button -->
        <button type="submit" class="text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
