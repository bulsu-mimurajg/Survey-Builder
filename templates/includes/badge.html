<!-- Reusable Badge Component -->
<!-- Usage: {% include 'includes/badge.html' with variant='success' text='Completed' %} -->
<!-- Variants: success, warning, info, error, default -->

{% if variant == 'success' %}
<span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded">{{ text }}</span>
{% elif variant == 'warning' %}
<span class="bg-yellow-100 text-yellow-800 text-xs font-medium px-2.5 py-0.5 rounded">{{ text }}</span>
{% elif variant == 'info' %}
<span class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded">{{ text }}</span>
{% elif variant == 'error' %}
<span class="bg-red-100 text-red-800 text-xs font-medium px-2.5 py-0.5 rounded">{{ text }}</span>
{% else %}
<span class="bg-gray-100 text-gray-800 text-xs font-medium px-2.5 py-0.5 rounded">{{ text }}</span>
{% endif %}
