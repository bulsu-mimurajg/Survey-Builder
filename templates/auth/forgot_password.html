{% extends 'base.html' %}

{% block title %}Forgot Password - sixsayvensurvey.io{% endblock %}

{% block content %}
<div class="min-h-screen flex">
    <!-- Left side - Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 lg:px-20 bg-white">
        <div class="max-w-md w-full mx-auto">
            <!-- Back to Sign In Link -->
            <a href="{% url 'signin' %}" class="inline-flex items-center text-gray-600 hover:text-gray-900 mb-12 text-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Back to Sign In
            </a>

            <!-- Header -->
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">
                    Reset your password
                </h1>
                <p class="text-gray-600">
                    Enter your email address and we'll send you instructions to reset your password.
                </p>
            </div>

            <!-- Form -->
            <form method="post" action="{% url 'forgot-password' %}" class="space-y-6">
                {% csrf_token %}
                
                <!-- Email Field -->
                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email address</label>
                    <input type="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5" placeholder="name@company.com" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-lg text-base px-5 py-3 text-center">
                    Send reset instructions
                </button>

                <!-- Back to Sign In -->
                <div class="text-center">
                    <a href="{% url 'signin' %}" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">
                        Remember your password? Sign in
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Right side - Image -->
    <div class="hidden lg:block lg:w-1/2 relative">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/90 to-purple-600/90 mix-blend-multiply"></div>
        <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80" 
             alt="Workspace" 
             class="h-full w-full object-cover">
    </div>
</div>
{% endblock %}
